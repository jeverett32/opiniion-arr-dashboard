services:
  arr-dashboard:
    build: .
    container_name: arr-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - arr_data:/app/data
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Optional: set TUNNEL_TOKEN from Cloudflare Zero Trust → Tunnels → Configure
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: arr-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      arr-dashboard:
        condition: service_healthy
    profiles:
      - tunnel

volumes:
  arr_data:
